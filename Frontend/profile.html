<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - LoopWear</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">

        <a href="index.html" class="logo">
            LoopWear
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#browse">Browse Clothes</a>
            <a href="dashboard.html">My Loop</a>
            <a href="#" id="logoutBtn">Logout</a>
        </nav>

    </header>


    <!-- PROFILE -->
    <main class="profile-page">

        <section class="profile-intro">

            <span class="profile-label">
                YOUR ACCOUNT
            </span>

            <h1>
                My Profile.
            </h1>

            <p>
                Manage your LoopWear account information.
            </p>

        </section>


        <section class="profile-card">

            <div class="profile-avatar" id="profileAvatar">
                LW
            </div>

            <div class="profile-status">
                ACTIVE MEMBER
            </div>


            <div class="profile-details">

                <div class="profile-detail">
                    <span>Name</span>
                    <strong id="profileName">—</strong>
                </div>

                <div class="profile-detail">
                    <span>Email</span>
                    <strong id="profileEmail">—</strong>
                </div>

                <div class="profile-detail">
                    <span>Location</span>
                    <strong id="profileLocation">—</strong>
                </div>

                <div class="profile-detail">
                    <span>Account Type</span>
                    <strong id="profileRole">Member</strong>
                </div>

            </div>


            <div class="profile-actions">

                <a href="dashboard.html" class="profile-button">
                    Back to My Loop
                    <span>→</span>
                </a>

                <button
                    type="button"
                    id="profileLogoutBtn"
                    class="profile-button secondary"
                >
                    Logout
                    <span>↗</span>
                </button>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <div>
            <strong>LoopWear</strong>
            <p>
                Swap. Reuse. Repeat.
            </p>
        </div>

        <p>
            © 2026 LOOPWEAR
        </p>

    </footer>


    <script src="config.js"></script>
    <script src="profile.js"></script>

</body>

</html>
